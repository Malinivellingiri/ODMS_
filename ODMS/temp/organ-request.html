<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODMS - Organ Request</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="navbar"><a class="logo" href="index.html"><span class="logo-heart">♥</span>ODMS</a><nav class="nav-links" id="navLinks"></nav></header><main class="detail-page"><div class="detail-card"><div class="detail-title"><h1>Request an Organ</h1><a class="btn light" href="recipient-dashboard.html">My Profile</a></div><form onsubmit="submitOrganRequest();return false"><div class="form-grid"><div class="form-group"><label>Organ Required</label><select id="requestOrgan" required><option value="">Select organ</option><option>Kidney</option><option>Liver</option><option>Heart</option><option>Lung</option><option>Pancreas</option></select></div><div class="form-group"><label>Urgency</label><select id="requestUrgency" required><option value="">Select urgency</option><option>Routine</option><option>Urgent</option><option>Serious</option><option>Critical</option></select></div></div><div class="form-group"><label>Additional Information</label><textarea id="requestNotes" rows="5" placeholder="Enter additional information"></textarea></div><button class="btn full" type="submit">Submit Organ Request</button></form></div><div id="status" class="detail-card" style="margin-top:20px"><h2>My Request Status</h2><div id="myRequests"></div></div></main><script src="../js/script.js"></script></body></html>
