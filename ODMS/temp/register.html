<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODMS - Register</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="navbar"><a class="logo" href="index.html"><span class="logo-heart">♥</span>ODMS</a><nav class="nav-links" id="navLinks"></nav></header><main class="auth-wrap"><div class="auth-card" style="width:min(760px,100%)"><div class="auth-logo"><a class="logo" style="justify-content:center" href="index.html"><span class="logo-heart">♥</span>ODMS</a></div><h1>Create Account</h1><p class="sub">Register as a donor or recipient</p><div id="registerMessage" class="message"></div><form id="registerForm"><div class="form-grid"><div class="form-group"><label>Full Name *</label><input name="name" required></div><div class="form-group"><label>Email ID *</label><input name="email" type="email" required></div><div class="form-group"><label>Phone Number *</label><input name="phone" maxlength="10" required></div><div class="form-group"><label>Age *</label><input name="age" type="number" min="1" max="100" required></div><div class="form-group"><label>Gender *</label><select name="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="form-group"><label>Role *</label><select name="role" id="registerRole" required><option value="">Select role</option><option>Donor</option><option>Recipient</option></select></div><div class="form-group"><label>Blood Group *</label><select name="bloodGroup" required><option value="">Select</option><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div><div class="form-group"><label>City *</label><input name="city" required></div><div class="form-group"><label>Password *</label><input name="password" type="password" required></div><div class="form-group"><label>Confirm Password *</label><input name="confirmPassword" type="password" required></div></div><div id="donorFields" style="display:none"><h3>Donor Details</h3><div class="form-grid"><div class="form-group"><label>Organ to Donate *</label><select name="organ"><option value="">Select organ</option><option>Kidney</option><option>Liver</option><option>Heart</option><option>Lung</option><option>Pancreas</option></select></div><div class="form-group"><label>Availability</label><select name="availability"><option>Available</option><option>Unavailable</option></select></div></div></div><div id="recipientFields" style="display:none"><h3>Recipient Details</h3><div class="form-grid"><div class="form-group"><label>Organ Required *</label><select name="requestedOrgan"><option value="">Select organ</option><option>Kidney</option><option>Liver</option><option>Heart</option><option>Lung</option><option>Pancreas</option></select></div><div class="form-group"><label>Urgency</label><select name="urgency"><option>Routine</option><option>Urgent</option><option>Serious</option><option>Critical</option></select></div></div></div><button class="btn green full" type="submit">Register</button></form><p class="small-note">Already registered? <a href="login.html" style="color:#1769d2;font-weight:700">Login here</a></p></div></main><script src="../js/script.js"></script></body></html>
